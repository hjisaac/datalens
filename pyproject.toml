[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datalens"
version = "0.1.0"
description = "Fast, streaming map-reduce statistics for tabular datasets (Parquet, CSV, TSV, JSONL)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/hjisaac/datalens"
Repository = "https://github.com/hjisaac/datalens"

[project.optional-dependencies]
parquet = [
    "pyarrow>=10.0.0",
]
dev = [
    "pytest>=7.0",
    "pyarrow>=10.0.0",
]
all = [
    "pyarrow>=10.0.0",
]

[project.scripts]
datalens = "datalens.__main__:app"
dataset-stats = "datalens.__main__:app"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "__main__.py", "core"]

[tool.hatch.build.targets.wheel.sources]
"" = "datalens"
