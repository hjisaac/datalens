[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataset-analyzer"
version = "0.1.0"
description = "Quick dataset analysis: token-level statistics over sequence columns."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.scripts]
dataset-analyzer = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "app"]

[tool.hatch.build.targets.sdist]
include = ["src", "app", "README.md", "ARCHITECTURE.md"]

[tool.ruff]
line-length = 100
src = ["src", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
